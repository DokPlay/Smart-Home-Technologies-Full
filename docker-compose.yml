name: smart-home-technologies

x-commerce-environment: &commerce-environment
  SERVER_PORT: 8080
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  EUREKA_INSTANCE_NON_SECURE_PORT: 8080
  SPRING_DATASOURCE_USERNAME: smarthome
  SPRING_DATASOURCE_PASSWORD: smarthome
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_OPEN_IN_VIEW: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smarthome
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: smarthome
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthome -d smarthome"]
      interval: 5s
      timeout: 5s
      retries: 20

  eureka-server:
    image: smart-home/eureka-server:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres-init-schemas:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: smarthome
    command: >
      sh -c "psql -h postgres -U smarthome -d smarthome -v ON_ERROR_STOP=1
      -c 'CREATE SCHEMA IF NOT EXISTS shopping_store;'
      -c 'CREATE SCHEMA IF NOT EXISTS shopping_cart;'
      -c 'CREATE SCHEMA IF NOT EXISTS warehouse;'
      -c 'CREATE SCHEMA IF NOT EXISTS orders;'
      -c 'CREATE SCHEMA IF NOT EXISTS payment;'
      -c 'CREATE SCHEMA IF NOT EXISTS delivery;'"
    depends_on:
      postgres:
        condition: service_healthy
  config-server:
    image: smart-home/config-server:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: config-server
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/app/config-repo
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      eureka-server:
        condition: service_healthy

  warehouse:
    image: smart-home/warehouse:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: commerce/warehouse
    environment:
      <<: *commerce-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smarthome?currentSchema=warehouse
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: warehouse
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-init-schemas:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  shopping-store:
    image: smart-home/shopping-store:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: commerce/shopping-store
    environment:
      <<: *commerce-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smarthome?currentSchema=shopping_store
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: shopping_store
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-init-schemas:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  shopping-cart:
    image: smart-home/shopping-cart:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: commerce/shopping-cart
    environment:
      <<: *commerce-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smarthome?currentSchema=shopping_cart
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: shopping_cart
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-init-schemas:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      warehouse:
        condition: service_healthy

  order:
    image: smart-home/order:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: commerce/order
    environment:
      <<: *commerce-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smarthome?currentSchema=orders
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: orders
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-init-schemas:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  payment:
    image: smart-home/payment:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: commerce/payment
    environment:
      <<: *commerce-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smarthome?currentSchema=payment
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: payment
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-init-schemas:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  delivery:
    image: smart-home/delivery:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: commerce/delivery
    environment:
      <<: *commerce-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smarthome?currentSchema=delivery
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: delivery
    ports:
      - "8086-8087:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-init-schemas:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  api-gateway:
    image: smart-home/api-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    environment:
      SERVER_PORT: 8080
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_NON_SECURE_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      # Standard Prometheus host port is 9090. Override PROMETHEUS_HOST_PORT if it is already busy locally.
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      shopping-store:
        condition: service_healthy
      shopping-cart:
        condition: service_healthy
      warehouse:
        condition: service_healthy
      order:
        condition: service_healthy
      payment:
        condition: service_healthy
      delivery:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local Docker profile: keep the documented admin/admin login without the first-run password prompt.
      GF_SECURITY_DISABLE_INITIAL_ADMIN_PASSWORD_CHANGE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The local monitoring stack is self-contained; avoid startup noise from external update/plugin checks.
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/smart-home-overview.json
    ports:
      # Standard Grafana host port is 3000. Override GRAFANA_HOST_PORT to open this dashboard on another local port.
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  prometheus-data:
  grafana-data:
