spring:
  application:
    name: delivery
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:delivery;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: ${DELIVERY_FEIGN_CIRCUITBREAKER_ENABLED:true}
        alphanumeric-ids:
          enabled: true
      client:
        config:
          order:
            connectTimeout: ${ORDER_FEIGN_CONNECT_TIMEOUT:1000}
            readTimeout: ${ORDER_FEIGN_READ_TIMEOUT:2000}
          warehouse:
            connectTimeout: ${WAREHOUSE_FEIGN_CONNECT_TIMEOUT:1000}
            readTimeout: ${WAREHOUSE_FEIGN_READ_TIMEOUT:2000}
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${DELIVERY_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:10}
        minimumNumberOfCalls: ${DELIVERY_CIRCUIT_BREAKER_MINIMUM_CALLS:3}
        failureRateThreshold: ${DELIVERY_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
        waitDurationInOpenState: ${DELIVERY_CIRCUIT_BREAKER_OPEN_WAIT:15s}
        permittedNumberOfCallsInHalfOpenState: ${DELIVERY_CIRCUIT_BREAKER_HALF_OPEN_CALLS:2}
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    configs:
      default:
        timeoutDuration: ${DELIVERY_TIME_LIMITER_TIMEOUT:2s}
server:
  port: ${SERVER_PORT:0}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}}
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: ${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
