spring:
  application:
    name: shopping-cart
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:shopping_cart;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: ${SHOPPING_CART_FEIGN_CIRCUITBREAKER_ENABLED:true}
        alphanumeric-ids:
          enabled: true
      client:
        config:
          warehouse:
            connectTimeout: ${WAREHOUSE_FEIGN_CONNECT_TIMEOUT:1000}
            readTimeout: ${WAREHOUSE_FEIGN_READ_TIMEOUT:2000}
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${WAREHOUSE_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:10}
        minimumNumberOfCalls: ${WAREHOUSE_CIRCUIT_BREAKER_MINIMUM_CALLS:3}
        failureRateThreshold: ${WAREHOUSE_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
        waitDurationInOpenState: ${WAREHOUSE_CIRCUIT_BREAKER_OPEN_WAIT:15s}
        permittedNumberOfCallsInHalfOpenState: ${WAREHOUSE_CIRCUIT_BREAKER_HALF_OPEN_CALLS:2}
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    configs:
      default:
        timeoutDuration: ${WAREHOUSE_TIME_LIMITER_TIMEOUT:2s}
server:
  port: ${SERVER_PORT:0}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}}
