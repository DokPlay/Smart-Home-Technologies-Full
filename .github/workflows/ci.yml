name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 9-gateway-microservices
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven-validate:
    name: Maven validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate project
        run: mvn -B validate

  maven-tests:
    name: Maven tests (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version:
          - "17"
          - "21"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Run tests
        run: mvn -B test

  maven-package:
    name: Maven package
    runs-on: ubuntu-latest
    needs:
      - maven-validate
      - maven-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build packages
        run: mvn -B -DskipTests package

  docker-compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose file
        run: docker compose config --quiet

  docker-images:
    name: Docker image build
    runs-on: ubuntu-latest
    needs:
      - maven-package
      - docker-compose-config

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker stack
        run: docker compose up -d --no-build --scale delivery=2

      - name: Smoke test Docker services
        shell: bash
        run: |
          set -euo pipefail

          wait_for_health() {
            local name="$1"
            local url="$2"

            for attempt in {1..60}; do
              if curl --fail --silent --show-error "${url}" | grep -q '"status":"UP"'; then
                echo "${name} is healthy"
                return 0
              fi

              sleep 5
            done

            echo "${name} did not become healthy" >&2
            docker compose ps
            docker compose logs --tail=200
            return 1
          }

          wait_for_health "eureka-server" "http://localhost:8761/actuator/health"
          wait_for_health "api-gateway" "http://localhost:8080/actuator/health"
          wait_for_health "shopping-store" "http://localhost:8081/actuator/health"
          wait_for_health "shopping-cart" "http://localhost:8082/actuator/health"
          wait_for_health "warehouse" "http://localhost:8083/actuator/health"
          wait_for_health "order" "http://localhost:8084/actuator/health"
          wait_for_health "payment" "http://localhost:8085/actuator/health"
          wait_for_health "delivery-1" "http://localhost:8086/actuator/health"
          wait_for_health "delivery-2" "http://localhost:8087/actuator/health"

          wait_for_eureka_apps() {
            for attempt in {1..60}; do
              curl --fail --silent --show-error -H "Accept: application/json" "http://localhost:8761/eureka/apps" > eureka-apps.json
              if python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("eureka-apps.json").read_text(encoding="utf-8"))
          applications = payload.get("applications", {}).get("application", [])
          if isinstance(applications, dict):
              applications = [applications]

          application_names = {
              application.get("name")
              for application in applications
          }
          required_applications = {
              "ORDER",
              "PAYMENT",
              "DELIVERY",
              "SHOPPING-STORE",
              "SHOPPING-CART",
              "WAREHOUSE",
          }
          missing_applications = sorted(required_applications - application_names)
          if missing_applications:
              raise SystemExit(
                  f"Missing Eureka applications: {missing_applications}; got {sorted(application_names)}"
              )

          delivery_application = next(
              application
              for application in applications
              if application.get("name") == "DELIVERY"
          )
          delivery_instances = delivery_application.get("instance", [])
          if isinstance(delivery_instances, dict):
              delivery_instances = [delivery_instances]

          if len(delivery_instances) < 2:
              raise SystemExit(
                  f"Expected at least 2 DELIVERY instances, got {len(delivery_instances)}"
              )

          print(
              "Eureka applications registered: "
              + ", ".join(sorted(application_names))
              + f"; DELIVERY instances: {len(delivery_instances)}"
          )
          PY
              then
                return 0
              fi

              echo "Eureka registry is not ready yet, attempt ${attempt}/60"
              sleep 5
            done

            echo "Eureka registry did not contain all required applications" >&2
            cat eureka-apps.json >&2
            docker compose logs --tail=200 eureka-server >&2
            return 1
          }

          wait_for_eureka_apps

      - name: Stop Docker stack
        if: always()
        run: docker compose down --remove-orphans
