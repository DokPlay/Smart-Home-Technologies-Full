<svg xmlns="http://www.w3.org/2000/svg" width="980" height="96" viewBox="0 0 980 96" role="img" aria-labelledby="title desc">
  <title id="title">Click to expand</title>
  <desc id="desc">Animated hint showing that the setup sections below can be expanded.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="976" height="92" rx="14" fill="#0f172a" filter="url(#softShadow)"/>
  <rect x="3" y="3" width="974" height="90" rx="13" fill="none" stroke="url(#panel)" stroke-width="2"/>
  <g transform="translate(47 48)">
    <circle r="22" fill="#38bdf8" opacity="0.2">
      <animate attributeName="r" values="22;29;22" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.07;0.2" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M-5 -11 L10 0 L-5 11 Z" fill="#38bdf8">
      <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="92" y="36" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Expandable setup notes</text>
  <text x="92" y="61" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Click the colored title or arrow below.</text>
  <text x="92" y="80" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Open website, hosting, CMS, CRM, and production guidance.</text>
  <g transform="translate(926 48)">
    <circle r="25" fill="#facc15" opacity="0.1"/>
    <path d="M-13 -6 L0 7 L13 -6" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate" values="0 -4;0 5;0 -4" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
