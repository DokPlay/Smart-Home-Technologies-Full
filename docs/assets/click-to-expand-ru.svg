<svg xmlns="http://www.w3.org/2000/svg" width="760" height="74" viewBox="0 0 760 74" role="img" aria-labelledby="title desc">
  <title id="title">Нажмите, чтобы раскрыть</title>
  <desc id="desc">Анимированная подсказка показывает, что блоки с инструкциями ниже можно раскрыть.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="756" height="70" rx="12" fill="#0f172a" filter="url(#softShadow)"/>
  <rect x="3" y="3" width="754" height="68" rx="11" fill="none" stroke="url(#panel)" stroke-width="2"/>
  <g transform="translate(34 37)">
    <circle r="17" fill="#38bdf8" opacity="0.24">
      <animate attributeName="r" values="17;23;17" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.24;0.08;0.24" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M-4 -9 L8 0 L-4 9 Z" fill="#38bdf8">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="74" y="31" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Раскрывающиеся инструкции</text>
  <text x="74" y="54" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Нажмите на цветной заголовок или стрелку ниже, чтобы открыть блок про сайт, хостинг, CMS, CRM или production.</text>
  <g transform="translate(690 37)">
    <path d="M-12 -6 L0 6 L12 -6" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate" values="0 -3;0 5;0 -3" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
